---
firewall_supported_os_families:
  - Debian

firewall_apt_cache_valid_time: 3600
firewall_apt_lock_timeout: 300
firewall_apt_update_cache_retries: 5
firewall_apt_update_cache_retry_max_delay: 30

firewall_package: ufw
firewall_default_incoming_policy: deny
firewall_default_outgoing_policy: allow

# Inbound TCP rules applied via UFW. Each entry:
#   port:        <int|string>  TCP port to open
#   sources:     [<cidr>...]   non-empty list of source CIDRs
#   description: <str>         human readable note
# Define per host group in group_vars/<group>/main.yml so the same role can
# manage k3s and runner hosts with different rule sets.
firewall_tcp_rules: []

# Shared admin SSH CIDR list (used by every host group for the 22/tcp rule).
# Set real values in inventories/cloud/group_vars/all/zz-local.yml (gitignored).
firewall_admin_ssh_sources: []

# k3s-specific CIDR source pools. Kept here as empty defaults so the k3s_hosts
# group_vars can build firewall_tcp_rules without redefining them. Override in
# inventories/cloud/group_vars/k3s_hosts/zz-local.yml (gitignored).
kube_api_allowed_cidrs: []
edge_http_cidrs:
  - 0.0.0.0/0
edge_allowed_client_cidrs: []
