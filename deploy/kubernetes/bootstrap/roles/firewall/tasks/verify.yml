---
- name: Read ufw status (verbose)
  ansible.builtin.command: ufw status verbose
  register: firewall_ufw_status
  changed_when: false
  tags: [firewall, verify]

- name: Assert ufw is active
  ansible.builtin.assert:
    that:
      - (firewall_ufw_status.stdout | lower) is search('(?m)^status:\\s+active\\s*$')
    fail_msg: "UFW must be active."
  tags: [firewall, verify]

- name: Assert ufw default policies are applied
  ansible.builtin.assert:
    that:
      - (firewall_ufw_status.stdout | lower) is search('default:.*' ~ firewall_default_incoming_policy ~ '\\s*\\(incoming\\)')
      - (firewall_ufw_status.stdout | lower) is search('default:.*' ~ firewall_default_outgoing_policy ~ '\\s*\\(outgoing\\)')
    fail_msg: >-
      UFW default policies mismatch. Expected incoming={{ firewall_default_incoming_policy }},
      outgoing={{ firewall_default_outgoing_policy }}.
  tags: [firewall, verify]

- name: Assert expected TCP ports are present in ufw rules
  ansible.builtin.assert:
    that:
      - (firewall_ufw_status.stdout | lower) is search(rule.port | string ~ '/tcp')
    fail_msg: "Expected UFW rule for TCP port {{ rule.port }} not found."
  loop: "{{ firewall_tcp_rules }}"
  loop_control:
    label: "{{ rule.port }}/tcp"
  vars:
    rule: '{{ item }}'
  tags: [firewall, verify]

- name: Assert each firewall TCP rule source is present in ufw
  ansible.builtin.assert:
    that:
      - >-
        (
          source == '0.0.0.0/0'
          and (firewall_ufw_status.stdout | lower) is search(
            '(?im)^\\s*' ~ (rule.port | string) ~ '/tcp\\s+allow in\\s+anywhere\\s*$'
          )
        )
        or
        (
          source != '0.0.0.0/0'
          and (firewall_ufw_status.stdout | lower) is search(
            '(?im)^\\s*' ~ (rule.port | string) ~ '/tcp\\s+allow in\\s+.*('
            ~ (source | regex_escape)
            ~ '|'
            ~ ((source | regex_replace('/32$', '')) | regex_escape)
            ~ ')\\s*$'
          )
        )
    fail_msg: "Missing expected UFW rule for {{ rule.port }}/tcp from {{ source }}"
  loop: "{{ firewall_tcp_rules | subelements('sources') }}"
  loop_control:
    label: "{{ rule.port }}/tcp <- {{ source }}"
  vars:
    rule: '{{ item.0 }}'
    source: '{{ item.1 }}'
  tags: [firewall, verify]
