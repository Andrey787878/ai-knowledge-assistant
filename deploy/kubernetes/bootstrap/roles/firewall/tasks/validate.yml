---
- name: Validate supported OS family
  ansible.builtin.assert:
    that:
      - ansible_os_family in firewall_supported_os_families
    fail_msg: "Unsupported OS family for firewall role: {{ ansible_os_family }}"
  tags: [firewall, validation]

- name: Validate firewall base settings
  ansible.builtin.assert:
    that:
      - firewall_package is string
      - firewall_package | trim | length > 0
      - firewall_default_incoming_policy in ['allow', 'deny', 'reject']
      - firewall_default_outgoing_policy in ['allow', 'deny', 'reject']
    fail_msg: >-
      Invalid firewall base settings. Check firewall_package
      and default policy values (allow/deny/reject).
  tags: [firewall, validation]

- name: Validate apt tuning values
  ansible.builtin.assert:
    that:
      - firewall_apt_cache_valid_time | int >= 0
      - firewall_apt_lock_timeout | int > 0
      - firewall_apt_update_cache_retries | int > 0
      - firewall_apt_update_cache_retry_max_delay | int > 0
    fail_msg: "Firewall apt timing values must be positive integers (cache_valid_time >= 0)."
  tags: [firewall, validation]

- name: Validate firewall_tcp_rules is a non-empty list
  ansible.builtin.assert:
    that:
      - firewall_tcp_rules is sequence
      - firewall_tcp_rules | length > 0
    fail_msg: >-
      firewall_tcp_rules must be a non-empty list. Define it per host group in
      group_vars/<group>/main.yml.
  tags: [firewall, validation]

- name: Validate each firewall TCP rule structure
  ansible.builtin.assert:
    that:
      - item.port is defined
      - item.port | string | trim | length > 0
      - item.sources is defined
      - item.sources is sequence
      - item.sources | length > 0
      - item.description is defined
      - item.description is string
      - item.description | trim | length > 0
    fail_msg: >-
      Invalid firewall_tcp_rules entry: each rule needs a non-empty port,
      a non-empty sources list and a non-empty description string.
  loop: "{{ firewall_tcp_rules }}"
  loop_control:
    label: "{{ item.port | default('?') }}/tcp"
  tags: [firewall, validation]

- name: Validate CIDR format in all firewall rule sources
  ansible.builtin.assert:
    that:
      - source is string
      - source | trim | length > 0
      - source is match('^((25[0-5]|2[0-4][0-9]|1?[0-9]{1,2})\\.){3}(25[0-5]|2[0-4][0-9]|1?[0-9]{1,2})/(3[0-2]|[12]?[0-9])$')
    fail_msg: "Invalid CIDR entry: {{ source }}"
  loop: "{{ firewall_tcp_rules | subelements('sources') }}"
  loop_control:
    label: "{{ item.0.port }}/tcp <- {{ item.1 }}"
  vars:
    source: '{{ item.1 }}'
  tags: [firewall, validation]
