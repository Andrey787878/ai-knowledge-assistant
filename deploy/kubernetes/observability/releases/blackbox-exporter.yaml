---
helmDefaults:
  skipDeps: true

releases:
  - name: blackbox-exporter
    namespace: {{ .Values.namespace | quote }}
    createNamespace: false
    chart: ../../vendor_charts/raw
    wait: true
    values:
      - resources:
          - apiVersion: v1
            kind: ServiceAccount
            metadata:
              name: blackbox-exporter
              labels:
                app.kubernetes.io/name: blackbox-exporter
                app.kubernetes.io/part-of: {{ .Values.app_part_of | quote }}
                app.kubernetes.io/managed-by: {{ .Values.app_managed_by | quote }}

          - apiVersion: v1
            kind: ConfigMap
            metadata:
              name: blackbox-exporter
              labels:
                app.kubernetes.io/name: blackbox-exporter
                app.kubernetes.io/part-of: {{ .Values.app_part_of | quote }}
                app.kubernetes.io/managed-by: {{ .Values.app_managed_by | quote }}
            data:
              blackbox.yml: |
                modules:
                  http_2xx:
                    prober: http
                    timeout: 5s
                    http:
                      preferred_ip_protocol: ip4
                      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]

          - apiVersion: apps/v1
            kind: Deployment
            metadata:
              name: blackbox-exporter
              labels:
                app.kubernetes.io/name: blackbox-exporter
                app.kubernetes.io/part-of: {{ .Values.app_part_of | quote }}
                app.kubernetes.io/managed-by: {{ .Values.app_managed_by | quote }}
            spec:
              replicas: 1
              selector:
                matchLabels:
                  app.kubernetes.io/name: blackbox-exporter
              template:
                metadata:
                  labels:
                    app.kubernetes.io/name: blackbox-exporter
                    app.kubernetes.io/part-of: {{ .Values.app_part_of | quote }}
                spec:
                  serviceAccountName: blackbox-exporter
                  automountServiceAccountToken: false
                  securityContext:
                    runAsNonRoot: true
                    runAsUser: 65534
                    runAsGroup: 65534
                    seccompProfile:
                      type: RuntimeDefault
                  containers:
                    - name: blackbox-exporter
                      image: quay.io/prometheus/blackbox-exporter:v0.25.0
                      imagePullPolicy: IfNotPresent
                      args:
                        - --config.file=/etc/blackbox_exporter/blackbox.yml
                      ports:
                        - name: http
                          containerPort: 9115
                          protocol: TCP
                      livenessProbe:
                        tcpSocket:
                          port: http
                        initialDelaySeconds: 10
                        periodSeconds: 10
                        timeoutSeconds: 3
                        failureThreshold: 6
                      readinessProbe:
                        tcpSocket:
                          port: http
                        initialDelaySeconds: 5
                        periodSeconds: 10
                        timeoutSeconds: 3
                        failureThreshold: 6
                      resources:
                        requests:
                          cpu: 25m
                          memory: 64Mi
                        limits:
                          cpu: 100m
                          memory: 128Mi
                      securityContext:
                        allowPrivilegeEscalation: false
                        capabilities:
                          drop:
                            - ALL
                        readOnlyRootFilesystem: true
                      volumeMounts:
                        - name: config
                          mountPath: /etc/blackbox_exporter
                          readOnly: true
                        - name: tmp
                          mountPath: /tmp
                  volumes:
                    - name: config
                      configMap:
                        name: blackbox-exporter
                    - name: tmp
                      emptyDir: {}

          - apiVersion: v1
            kind: Service
            metadata:
              name: blackbox-exporter
              labels:
                app.kubernetes.io/name: blackbox-exporter
                app.kubernetes.io/part-of: {{ .Values.app_part_of | quote }}
                app.kubernetes.io/managed-by: {{ .Values.app_managed_by | quote }}
                app.kubernetes.io/component: metrics
            spec:
              type: ClusterIP
              selector:
                app.kubernetes.io/name: blackbox-exporter
              ports:
                - name: http
                  port: 9115
                  targetPort: http
                  protocol: TCP

          - apiVersion: monitoring.coreos.com/v1
            kind: ServiceMonitor
            metadata:
              name: blackbox-exporter
              labels:
                release: kube-prometheus-stack
                app.kubernetes.io/name: blackbox-exporter
                app.kubernetes.io/part-of: {{ .Values.app_part_of | quote }}
                app.kubernetes.io/managed-by: {{ .Values.app_managed_by | quote }}
            spec:
              selector:
                matchLabels:
                  app.kubernetes.io/name: blackbox-exporter
                  app.kubernetes.io/component: metrics
              namespaceSelector:
                matchNames:
                  - {{ .Values.namespace | quote }}
              endpoints:
                - port: http
                  path: /metrics
                  interval: 30s
