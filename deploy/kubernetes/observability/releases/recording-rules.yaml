---
helmDefaults:
  skipDeps: true

releases:
  - name: observability-recording-rules
    namespace: {{ .Values.namespace | quote }}
    createNamespace: false
    chart: ../../vendor_charts/raw
    wait: true
    values:
      - resources:
          - apiVersion: monitoring.coreos.com/v1
            kind: PrometheusRule
            metadata:
              name: observability-recording-rules
              labels:
                release: kube-prometheus-stack
                app.kubernetes.io/part-of: {{ .Values.app_part_of | quote }}
                app.kubernetes.io/managed-by: {{ .Values.app_managed_by | quote }}
            spec:
              groups:
                - name: sli-availability
                  interval: 30s
                  rules:
                    - record: sli:n8n_availability:ratio_5m
                      expr: avg(avg_over_time(probe_success{job="blackbox-n8n",namespace="n8n"}[5m])) or on() vector(0)
                    - record: sli:n8n_availability:ratio_30m
                      expr: avg(avg_over_time(probe_success{job="blackbox-n8n",namespace="n8n"}[30m])) or on() vector(0)
                    - record: sli:wiki_availability:ratio_5m
                      expr: avg(avg_over_time(probe_success{job="blackbox-wiki",namespace="wiki"}[5m])) or on() vector(0)
                    - record: sli:wiki_availability:ratio_30m
                      expr: avg(avg_over_time(probe_success{job="blackbox-wiki",namespace="wiki"}[30m])) or on() vector(0)
                    - record: sli:ollama_availability:ratio_5m
                      expr: avg(avg_over_time(probe_success{job="blackbox-ollama",namespace="ollama"}[5m])) or on() vector(0)
                    - record: sli:ollama_availability:ratio_30m
                      expr: avg(avg_over_time(probe_success{job="blackbox-ollama",namespace="ollama"}[30m])) or on() vector(0)
                    - record: sli:n8n_public_availability:ratio_5m
                      expr: avg(avg_over_time(probe_success{job="blackbox-public-n8n",namespace="n8n",instance={{ .Values.public_probe_targets.n8n | quote }}}[5m])) or on() vector(0)
                    - record: sli:n8n_public_availability:ratio_30m
                      expr: avg(avg_over_time(probe_success{job="blackbox-public-n8n",namespace="n8n",instance={{ .Values.public_probe_targets.n8n | quote }}}[30m])) or on() vector(0)
                    - record: sli:n8n_public_availability:ratio_1h
                      expr: avg(avg_over_time(probe_success{job="blackbox-public-n8n",namespace="n8n",instance={{ .Values.public_probe_targets.n8n | quote }}}[1h])) or on() vector(0)
                    - record: sli:n8n_public_availability:ratio_6h
                      expr: avg(avg_over_time(probe_success{job="blackbox-public-n8n",namespace="n8n",instance={{ .Values.public_probe_targets.n8n | quote }}}[6h])) or on() vector(0)
                    - record: sli:wiki_public_availability:ratio_5m
                      expr: avg(avg_over_time(probe_success{job="blackbox-public-wiki",namespace="wiki",instance={{ .Values.public_probe_targets.wiki | quote }}}[5m])) or on() vector(0)
                    - record: sli:wiki_public_availability:ratio_30m
                      expr: avg(avg_over_time(probe_success{job="blackbox-public-wiki",namespace="wiki",instance={{ .Values.public_probe_targets.wiki | quote }}}[30m])) or on() vector(0)
                    - record: sli:wiki_public_availability:ratio_1h
                      expr: avg(avg_over_time(probe_success{job="blackbox-public-wiki",namespace="wiki",instance={{ .Values.public_probe_targets.wiki | quote }}}[1h])) or on() vector(0)
                    - record: sli:wiki_public_availability:ratio_6h
                      expr: avg(avg_over_time(probe_success{job="blackbox-public-wiki",namespace="wiki",instance={{ .Values.public_probe_targets.wiki | quote }}}[6h])) or on() vector(0)
                    - record: sli:n8n_metrics_target:ratio_5m
                      expr: avg(avg_over_time(up{job="n8n-web",namespace="n8n"}[5m])) or on() vector(0)
                    - record: sli:n8n_metrics_target:ratio_30m
                      expr: avg(avg_over_time(up{job="n8n-web",namespace="n8n"}[30m])) or on() vector(0)
                    - record: sli:postgres_availability:ratio_5m
                      expr: avg(avg_over_time(probe_success{job="blackbox-postgres",namespace="db"}[5m])) or on() vector(0)
                    - record: sli:postgres_availability:ratio_30m
                      expr: avg(avg_over_time(probe_success{job="blackbox-postgres",namespace="db"}[30m])) or on() vector(0)
                    - record: sli:redis_availability:ratio_5m
                      expr: avg(avg_over_time(probe_success{job="blackbox-redis",namespace="n8n"}[5m])) or on() vector(0)
                    - record: sli:redis_availability:ratio_30m
                      expr: avg(avg_over_time(probe_success{job="blackbox-redis",namespace="n8n"}[30m])) or on() vector(0)
                - name: rollout
                  interval: 30s
                  rules:
                    - record: rollout:n8n_active
                      expr: |
                        (
                          kube_deployment_metadata_generation{namespace="n8n",deployment="n8n-web"}
                          != kube_deployment_status_observed_generation{namespace="n8n",deployment="n8n-web"}
                        )
                        or on() (
                          kube_deployment_status_replicas{namespace="n8n",deployment="n8n-web"}
                          != kube_deployment_spec_replicas{namespace="n8n",deployment="n8n-web"}
                        )
                        or on() (
                          kube_deployment_status_replicas_updated{namespace="n8n",deployment="n8n-web"}
                          < kube_deployment_spec_replicas{namespace="n8n",deployment="n8n-web"}
                        )
                        or on() (
                          kube_deployment_status_replicas_available{namespace="n8n",deployment="n8n-web"}
                          < kube_deployment_spec_replicas{namespace="n8n",deployment="n8n-web"}
                        )
                        or on() (
                          kube_deployment_status_replicas_ready{namespace="n8n",deployment="n8n-web"}
                          < kube_deployment_spec_replicas{namespace="n8n",deployment="n8n-web"}
                        )
                    - record: rollout:n8n_recently_finished
                      expr: max_over_time(rollout:n8n_active[15m]) > 0
                    - record: rollout:n8n_deploy_window
                      expr: |
                        (
                          time() - kube_deployment_created{namespace="n8n",deployment="n8n-web"} < 20 * 60
                        )
                        or on() (
                          kube_deployment_metadata_generation{namespace="n8n",deployment="n8n-web"}
                          != kube_deployment_status_observed_generation{namespace="n8n",deployment="n8n-web"}
                        )
                        or on() (
                          changes(kube_deployment_metadata_generation{namespace="n8n",deployment="n8n-web"}[20m]) > 0
                        )
                    - record: rollout:n8n_burn_cooldown
                      expr: max_over_time(rollout:n8n_active[75m]) > 0
                    - record: rollout:wiki_active
                      expr: |
                        (
                          kube_deployment_metadata_generation{namespace="wiki",deployment="wikijs"}
                          != kube_deployment_status_observed_generation{namespace="wiki",deployment="wikijs"}
                        )
                        or on() (
                          kube_deployment_status_replicas{namespace="wiki",deployment="wikijs"}
                          != kube_deployment_spec_replicas{namespace="wiki",deployment="wikijs"}
                        )
                        or on() (
                          kube_deployment_status_replicas_updated{namespace="wiki",deployment="wikijs"}
                          < kube_deployment_spec_replicas{namespace="wiki",deployment="wikijs"}
                        )
                        or on() (
                          kube_deployment_status_replicas_available{namespace="wiki",deployment="wikijs"}
                          < kube_deployment_spec_replicas{namespace="wiki",deployment="wikijs"}
                        )
                        or on() (
                          kube_deployment_status_replicas_ready{namespace="wiki",deployment="wikijs"}
                          < kube_deployment_spec_replicas{namespace="wiki",deployment="wikijs"}
                        )
                    - record: rollout:wiki_recently_finished
                      expr: max_over_time(rollout:wiki_active[15m]) > 0
                    - record: rollout:wiki_deploy_window
                      expr: |
                        (
                          time() - kube_deployment_created{namespace="wiki",deployment="wikijs"} < 20 * 60
                        )
                        or on() (
                          kube_deployment_metadata_generation{namespace="wiki",deployment="wikijs"}
                          != kube_deployment_status_observed_generation{namespace="wiki",deployment="wikijs"}
                        )
                        or on() (
                          changes(kube_deployment_metadata_generation{namespace="wiki",deployment="wikijs"}[20m]) > 0
                        )
                    - record: rollout:wiki_burn_cooldown
                      expr: max_over_time(rollout:wiki_active[75m]) > 0
                    - record: rollout:ollama_active
                      expr: |
                        (
                          kube_deployment_metadata_generation{namespace="ollama",deployment="ollama"}
                          != kube_deployment_status_observed_generation{namespace="ollama",deployment="ollama"}
                        )
                        or on() (
                          kube_deployment_status_replicas{namespace="ollama",deployment="ollama"}
                          != kube_deployment_spec_replicas{namespace="ollama",deployment="ollama"}
                        )
                        or on() (
                          kube_deployment_status_replicas_updated{namespace="ollama",deployment="ollama"}
                          < kube_deployment_spec_replicas{namespace="ollama",deployment="ollama"}
                        )
                        or on() (
                          kube_deployment_status_replicas_available{namespace="ollama",deployment="ollama"}
                          < kube_deployment_spec_replicas{namespace="ollama",deployment="ollama"}
                        )
                        or on() (
                          kube_deployment_status_replicas_ready{namespace="ollama",deployment="ollama"}
                          < kube_deployment_spec_replicas{namespace="ollama",deployment="ollama"}
                        )
                    - record: rollout:ollama_recently_finished
                      expr: max_over_time(rollout:ollama_active[15m]) > 0
                    - record: rollout:ollama_deploy_window
                      expr: |
                        (
                          time() - kube_deployment_created{namespace="ollama",deployment="ollama"} < 20 * 60
                        )
                        or on() (
                          kube_deployment_metadata_generation{namespace="ollama",deployment="ollama"}
                          != kube_deployment_status_observed_generation{namespace="ollama",deployment="ollama"}
                        )
                        or on() (
                          changes(kube_deployment_metadata_generation{namespace="ollama",deployment="ollama"}[20m]) > 0
                        )
                    - record: rollout:ollama_burn_cooldown
                      expr: max_over_time(rollout:ollama_active[75m]) > 0
                - name: sli-ingress
                  interval: 30s
                  rules:
                    # Ingress HTTP golden signals for n8n and wiki, derived
                    # from Traefik router metrics. Router matchers select the
                    # http and websecure routers for each service and exclude
                    # transient ACME challenge routers (cm-acme-http-solver-*).
                    - record: sli:n8n_ingress_requests:rate5m
                      expr: sum(rate(traefik_router_requests_total{router=~".*n8n-n8n-web-ingress.*@kubernetes"}[5m]))
                    - record: sli:wiki_ingress_requests:rate5m
                      expr: sum(rate(traefik_router_requests_total{router=~".*wiki-wikijs.*@kubernetes"}[5m]))
                    - record: sli:n8n_ingress_5xx:ratio5m
                      expr: (sum(rate(traefik_router_requests_total{router=~".*n8n-n8n-web-ingress.*@kubernetes",code=~"5.."}[5m])) / sum(rate(traefik_router_requests_total{router=~".*n8n-n8n-web-ingress.*@kubernetes"}[5m]))) or on() vector(0)
                    - record: sli:wiki_ingress_5xx:ratio5m
                      expr: (sum(rate(traefik_router_requests_total{router=~".*wiki-wikijs.*@kubernetes",code=~"5.."}[5m])) / sum(rate(traefik_router_requests_total{router=~".*wiki-wikijs.*@kubernetes"}[5m]))) or on() vector(0)
                    - record: sli:n8n_ingress_latency:p95_5m
                      expr: histogram_quantile(0.95, sum by (le) (rate(traefik_router_request_duration_seconds_bucket{router=~".*n8n-n8n-web-ingress.*@kubernetes"}[5m])))
                    - record: sli:wiki_ingress_latency:p95_5m
                      expr: histogram_quantile(0.95, sum by (le) (rate(traefik_router_request_duration_seconds_bucket{router=~".*wiki-wikijs.*@kubernetes"}[5m])))
                - name: sli-observability
                  interval: 30s
                  rules:
                    - record: sli:prometheus_scrape_health:ratio_5m
                      expr: avg by (job, namespace) (avg_over_time(up{job=~"kube-state-metrics|prometheus-node-exporter|blackbox-exporter|n8n-web|.*postgresql-metrics.*|.*redis-metrics.*",namespace=~"observability|n8n|db"}[5m]))
                    - record: sli:prometheus_scrape_health:ratio_30m
                      expr: avg by (job, namespace) (avg_over_time(up{job=~"kube-state-metrics|prometheus-node-exporter|blackbox-exporter|n8n-web|.*postgresql-metrics.*|.*redis-metrics.*",namespace=~"observability|n8n|db"}[30m]))
                    - record: sli:alertmanager_notification_success:ratio_5m
                      expr: (sum(rate(alertmanager_notifications_total{job="observability-alertmanager",namespace="observability",integration=~".*"}[5m])) - sum(rate(alertmanager_notifications_failed_total{job="observability-alertmanager",namespace="observability",integration=~".*"}[5m]))) / sum(rate(alertmanager_notifications_total{job="observability-alertmanager",namespace="observability",integration=~".*"}[5m]))
                    - record: sli:alertmanager_notification_success:ratio_30m
                      expr: (sum(rate(alertmanager_notifications_total{job="observability-alertmanager",namespace="observability",integration=~".*"}[30m])) - sum(rate(alertmanager_notifications_failed_total{job="observability-alertmanager",namespace="observability",integration=~".*"}[30m]))) / sum(rate(alertmanager_notifications_total{job="observability-alertmanager",namespace="observability",integration=~".*"}[30m]))
