---
# CI/validation environment overrides.
#
# This environment is used for `helmfile -e ci template/build` validation in CI
# (no real cluster). CIDRs below are placeholders that mirror the prod layout
# so that rendered NetworkPolicies remain structurally valid; they are never
# applied against a running cluster in CI.
namespace: observability
app_part_of: ai-knowledge-assistant
app_managed_by: helmfile

network_policy:
  kubernetes_api_service_cidr: 10.43.0.1/32
  node_cidr: 10.20.0.3/32
  external_cidr: 0.0.0.0/0

# Availability SLO targets (single source of truth for alert thresholds).
# CI mirrors prod so rendered PrometheusRules remain structurally identical.
slo:
  n8n: 0.995
  wiki: 0.995
  ollama: 0.99

public_probe_targets:
  n8n: https://10.20.0.3/rest/settings
  wiki: https://10.20.0.3/healthz
