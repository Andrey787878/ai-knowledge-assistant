---
# CI/validation blackbox probe fixtures.
#
# Internal probe targets mirror the prod service DNS names so that rendered
# Probe CRs are structurally valid for `helmfile -e ci build`. They are never
# actually probed: CI only renders/validates manifests and does not run a
# Prometheus/blackbox-exporter.
blackbox:
  interval: 30s
  module: http_2xx
  targets:
    n8n:
      url: http://n8n-web-svc.n8n.svc.cluster.local/healthz
      app: n8n
      namespace: n8n
      module: http_2xx
    wiki:
      url: http://wikijs.wiki.svc.cluster.local/healthz
      app: wiki
      namespace: wiki
      module: http_2xx
    ollama:
      url: http://ollama-svc.ollama.svc.cluster.local:11434/api/version
      app: ollama
      namespace: ollama
      module: http_2xx
    postgres:
      url: postgres-postgresql.db.svc.cluster.local:5432
      app: postgres
      namespace: db
      module: tcp_connect
    redis:
      url: redis-master.n8n.svc.cluster.local:6379
      app: redis
      namespace: n8n
      module: tcp_connect
  # Public HTTPS probes are disabled in CI: there is no real ingress/TLS in the
  # validation environment, and external endpoints must not be probed from CI.
  publicTargets: {}
