name: CD k3s auto

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: read
  actions: read

concurrency:
  group: k3s-prod-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy full k3s stack
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.event == 'push'
      }}
    runs-on:
      - self-hosted
      - linux
      - x64
      - k3s
      - prod
      - deploy
    environment: production
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      KUBECONFIG: /home/github-runner/.kube/config
      SOPS_AGE_KEY_FILE: /home/github-runner/.config/sops/age/keys.txt
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify workflow run is still current main tip
        id: freshness
        run: |
          git fetch origin main --depth=1
          current_main_sha="$(git rev-parse origin/main)"
          workflow_sha="${{ github.event.workflow_run.head_sha }}"

          {
            echo "current_main_sha=${current_main_sha}"
          } >> "${GITHUB_OUTPUT}"

          if [[ "${workflow_sha}" != "${current_main_sha}" ]]; then
            {
              echo "stale=true"
            } >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          {
            echo "stale=false"
          } >> "${GITHUB_OUTPUT}"

      - name: Verify runner tooling
        if: steps.freshness.outputs.stale != 'true'
        run: |
          kubectl version --client
          helm version
          helmfile --version
          sops --version

      - name: Skip stale auto deploy
        if: steps.freshness.outputs.stale == 'true'
        run: |
          {
            echo "## k3s CD auto"
            echo
            echo "Skipped deploy because the triggering CI run is stale."
            echo
            echo "Workflow run SHA: \`${{ github.event.workflow_run.head_sha }}\`"
            echo "Current main SHA: \`${{ steps.freshness.outputs.current_main_sha }}\`"
            echo "Mode: full"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Deploy full stack
        if: steps.freshness.outputs.stale != 'true'
        run: |
          bash .github/scripts/cd/deploy-k3s-scope.sh all
          bash .github/scripts/cd/smoke-k3s-scope.sh all

      - name: Persist successful deploy state
        if: steps.freshness.outputs.stale != 'true'
        run: |
          bash .github/scripts/cd/delivery-state.sh mark-success \
            --sha "${{ github.event.workflow_run.head_sha }}" \
            --mode full \
            --scopes all

      - name: Write deploy summary
        if: steps.freshness.outputs.stale != 'true'
        run: |
          {
            echo "## k3s CD auto"
            echo
            echo "Ref: \`${{ github.event.workflow_run.head_sha }}\`"
            echo "Mode: full"
            echo "Scopes: \`all\`"
          } >> "${GITHUB_STEP_SUMMARY}"
