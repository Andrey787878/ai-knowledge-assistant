name: CD k3s auto

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cd-k3s-auto.yml
      - .github/scripts/cd/**
      - deploy/kubernetes/**
      - '!deploy/kubernetes/bootstrap/**'
      - '!deploy/kubernetes/*.md'
      - '!deploy/kubernetes/**/*.md'

permissions:
  contents: read
  actions: read

concurrency:
  group: k3s-prod-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy full k3s stack
    runs-on:
      - self-hosted
      - linux
      - x64
      - k3s
      - prod
      - deploy
    environment: production
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      KUBECONFIG: /home/github-runner/.kube/config
      SOPS_AGE_KEY_FILE: /home/github-runner/.config/sops/age/keys.txt
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Wait for successful CI on current main SHA
        run: |
          bash .github/scripts/cd/verify-ci-success.sh \
            --workflow ci.yml \
            --ref main \
            --sha "${{ github.sha }}" \
            --wait \
            --timeout-seconds 3600 \
            --poll-interval-seconds 20

      - name: Ensure run still targets current main HEAD
        id: freshness
        run: |
          git fetch origin main --depth=1
          current_main_sha="$(git rev-parse origin/main)"

          if [[ "${current_main_sha}" != "${{ github.sha }}" ]]; then
            {
              echo "stale=true"
              echo "current_main_sha=${current_main_sha}"
            } >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          {
            echo "stale=false"
            echo "current_main_sha=${current_main_sha}"
          } >> "${GITHUB_OUTPUT}"

      - name: Verify runner tooling
        if: steps.freshness.outputs.stale != 'true'
        run: |
          kubectl version --client
          helm version
          helmfile --version
          sops --version

      - name: Deploy full stack
        if: steps.freshness.outputs.stale != 'true'
        run: |
          bash .github/scripts/cd/deploy-k3s-scope.sh all
          bash .github/scripts/cd/smoke-k3s-scope.sh all

      - name: Persist successful deploy state
        if: steps.freshness.outputs.stale != 'true'
        run: |
          bash .github/scripts/cd/delivery-state.sh mark-success \
            --sha "${{ github.sha }}" \
            --mode full \
            --scopes all

      - name: Write stale run summary
        if: steps.freshness.outputs.stale == 'true'
        run: |
          {
            echo "## k3s CD auto"
            echo
            echo "Skipped stale auto-deploy run."
            echo "Triggered SHA: \`${{ github.sha }}\`"
            echo "Current main SHA: \`${{ steps.freshness.outputs.current_main_sha }}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Write deploy summary
        if: steps.freshness.outputs.stale != 'true'
        run: |
          {
            echo "## k3s CD auto"
            echo
            echo "Ref: \`${{ github.sha }}\`"
            echo "Mode: full"
            echo "Scopes: \`all\`"
          } >> "${GITHUB_STEP_SUMMARY}"
