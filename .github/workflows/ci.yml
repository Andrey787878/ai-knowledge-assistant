name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository sanity
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install YAML linter
        run: python -m pip install yamllint==1.35.1

      - name: Lint YAML
        run: yamllint .github deploy

      - name: Validate n8n workflow JSON
        run: |
          node <<'NODE'
          const fs = require("fs");
          const dir = "n8n/workflows";

          for (const file of fs.readdirSync(dir).filter((name) => name.endsWith(".json"))) {
            JSON.parse(fs.readFileSync(`${dir}/${file}`, "utf8"));
            console.log(`ok ${file}`);
          }
          NODE

      - name: Check local-only files are not committed
        run: |
          forbidden='(^|/)(terraform\.tfvars|backend\.hcl|hosts\.yml|zz-local\.yml|vault-pass\.txt)$|\.tfstate(\.|$)|\.tfplan$'
          if git ls-files | grep -E "$forbidden"; then
            echo "Local-only or state files are tracked. Remove them from git." >&2
            exit 1
          fi

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  terraform:
    name: Terraform
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.10.5'

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: 'v0.55.1'

      - name: Check formatting
        run: terraform fmt -check -recursive deploy/terraform

      - name: Validate modules
        run: |
          for dir in deploy/terraform/ansible_deploy deploy/terraform/k3s_deploy; do
            echo "==> ${dir}"
            terraform -chdir="${dir}" init -backend=false
            terraform -chdir="${dir}" validate
          done

      - name: Lint modules
        run: |
          for dir in deploy/terraform/ansible_deploy deploy/terraform/k3s_deploy; do
            echo "==> ${dir}"
            tflint --chdir="${dir}" --config="${GITHUB_WORKSPACE}/.tflint.hcl"
          done

  helm:
    name: Helm charts
    runs-on: ubuntu-24.04
    env:
      KUBECONFORM_VERSION: '0.6.7'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.20.0'

      - name: Install SOPS
        env:
          SOPS_VERSION: '3.10.2'
        run: |
          curl -sSL \
            "https://github.com/getsops/sops/releases/download/v${SOPS_VERSION}/sops-v${SOPS_VERSION}.linux.amd64" \
            -o /tmp/sops
          sudo install -m 0755 /tmp/sops /usr/local/bin/sops
          sops --version

      - name: Install helm-secrets plugin
        env:
          HELM_SECRETS_VERSION: '4.6.11'
        run: |
          helm plugin install https://github.com/jkroepke/helm-secrets --version "v${HELM_SECRETS_VERSION}"
          helm plugin list

      - name: Install Helmfile
        env:
          HELMFILE_VERSION: '0.170.1'
        run: |
          curl -sSL \
            "https://github.com/helmfile/helmfile/releases/download/v${HELMFILE_VERSION}/helmfile_${HELMFILE_VERSION}_linux_amd64.tar.gz" \
            -o /tmp/helmfile.tar.gz
          tar -xzf /tmp/helmfile.tar.gz -C /tmp helmfile
          sudo install -m 0755 /tmp/helmfile /usr/local/bin/helmfile
          helmfile --version

      - name: Install kubeconform
        run: |
          curl -sSL \
            "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            -o /tmp/kubeconform.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp kubeconform
          sudo install -m 0755 /tmp/kubeconform /usr/local/bin/kubeconform
          kubeconform -v

      - name: Lint charts
        run: |
          helm lint deploy/kubernetes/apps/n8n/chart \
            -f deploy/kubernetes/apps/n8n/environments/prod/app.values.yaml

          helm lint deploy/kubernetes/apps/ollama/chart \
            -f deploy/kubernetes/apps/ollama/environments/prod/app.values.yaml

          helm lint deploy/kubernetes/vendor_charts/kube-prometheus-stack \
            -f deploy/kubernetes/observability/environments/prod/kube-prometheus-stack.values.yaml \
            --set alertmanager.smtp.auth_password=dummy

          helm lint deploy/kubernetes/vendor_charts/loki \
            -f deploy/kubernetes/observability/environments/prod/loki.values.yaml

          helm lint deploy/kubernetes/vendor_charts/alloy \
            -f deploy/kubernetes/observability/environments/prod/alloy.values.yaml

      - name: Validate Helmfile composition
        run: helmfile -f deploy/kubernetes/helmfile.yaml -e ci build >/dev/null

      - name: Render charts
        run: |
          helm template n8n deploy/kubernetes/apps/n8n/chart \
            -f deploy/kubernetes/apps/n8n/environments/prod/app.values.yaml \
            >/tmp/n8n-rendered.yaml

          helm template ollama deploy/kubernetes/apps/ollama/chart \
            -f deploy/kubernetes/apps/ollama/environments/prod/app.values.yaml \
            >/tmp/ollama-rendered.yaml

          helm template kube-prometheus-stack \
            deploy/kubernetes/vendor_charts/kube-prometheus-stack \
            --namespace observability \
            -f deploy/kubernetes/observability/environments/prod/kube-prometheus-stack.values.yaml \
            --set alertmanager.smtp.auth_password=dummy \
            >/tmp/kube-prometheus-stack-rendered.yaml

          helm template loki deploy/kubernetes/vendor_charts/loki \
            --namespace observability \
            --api-versions monitoring.coreos.com/v1/ServiceMonitor \
            -f deploy/kubernetes/observability/environments/prod/loki.values.yaml \
            >/tmp/loki-rendered.yaml

          helm template alloy deploy/kubernetes/vendor_charts/alloy \
            --namespace observability \
            -f deploy/kubernetes/observability/environments/prod/alloy.values.yaml \
            >/tmp/alloy-rendered.yaml

      - name: Render full Kubernetes stack
        run: |
          helmfile -f deploy/kubernetes/helmfile.yaml -e ci template \
            >/tmp/k3s-rendered.yaml

      - name: Validate rendered manifests
        run: |
          kubeconform \
            -strict \
            -summary \
            -ignore-missing-schemas \
            /tmp/n8n-rendered.yaml \
            /tmp/ollama-rendered.yaml \
            /tmp/kube-prometheus-stack-rendered.yaml \
            /tmp/loki-rendered.yaml \
            /tmp/alloy-rendered.yaml

      - name: Validate full rendered stack
        run: |
          kubeconform \
            -strict \
            -summary \
            -ignore-missing-schemas \
            /tmp/k3s-rendered.yaml

  ansible:
    name: Ansible syntax
    runs-on: ubuntu-24.04
    env:
      ANSIBLE_LOCAL_TEMP: /tmp/ansible-local
      ANSIBLE_REMOTE_TEMP: /tmp/.ansible/tmp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          python -m pip install ansible-core==2.18.6
          ansible --version

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: '1.7.7'
        run: |
          curl -sSL \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            -o /tmp/actionlint.tar.gz
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          sudo install -m 0755 /tmp/actionlint /usr/local/bin/actionlint
          actionlint -version

      - name: Lint bash scripts
        run: |
          shellcheck deploy/kubernetes/apps/postgres/scripts/*.sh
          shellcheck .github/scripts/cd/*.sh

      - name: Validate bash syntax
        run: |
          bash -n deploy/kubernetes/apps/postgres/scripts/backup-postgres.sh
          bash -n deploy/kubernetes/apps/postgres/scripts/restore-postgres.sh
          bash -n .github/scripts/cd/delivery-state.sh
          bash -n .github/scripts/cd/detect-k3s-scopes.sh
          bash -n .github/scripts/cd/deploy-k3s-scope.sh
          bash -n .github/scripts/cd/smoke-k3s-scope.sh

      - name: Validate GitHub workflows
        run: |
          actionlint -config-file actionlint.yaml .github/workflows/ci.yml
          actionlint -config-file actionlint.yaml .github/workflows/cd-k3s-auto.yml
          actionlint -config-file actionlint.yaml .github/workflows/cd-k3s-manual.yml

      - name: Install Ansible collections
        run: |
          ansible-galaxy collection install -r deploy/ansible/requirements.yml
          ansible-galaxy collection install -r deploy/kubernetes/bootstrap/requirements.yml

      - name: Validate VM inventory example
        run: |
          cp deploy/ansible/inventories/cloud/hosts.yml.example /tmp/vm-hosts.yml
          ansible-inventory -i /tmp/vm-hosts.yml --list >/tmp/vm-inventory.json
          grep -q '"db"' /tmp/vm-inventory.json
          grep -q '"wiki"' /tmp/vm-inventory.json

      - name: Syntax check VM playbook
        env:
          ANSIBLE_ROLES_PATH: ${{ github.workspace }}/deploy/ansible/roles
        run: |
          ansible-playbook \
            -i /tmp/vm-hosts.yml \
            deploy/ansible/playbooks/site.yml \
            --syntax-check

      - name: Validate k3s inventory example
        run: |
          cp deploy/kubernetes/bootstrap/inventories/cloud/hosts.yml.example /tmp/k3s-hosts.yml
          ansible-inventory -i /tmp/k3s-hosts.yml --list >/tmp/k3s-inventory.json
          grep -q '"k3s"' /tmp/k3s-inventory.json
          grep -q '"runner"' /tmp/k3s-inventory.json

      - name: Syntax check k3s bootstrap playbook
        env:
          ANSIBLE_ROLES_PATH: ${{ github.workspace }}/deploy/kubernetes/bootstrap/roles
        run: |
          ansible-playbook \
            -i /tmp/k3s-hosts.yml \
            deploy/kubernetes/bootstrap/playbooks/site.yml \
            --syntax-check
